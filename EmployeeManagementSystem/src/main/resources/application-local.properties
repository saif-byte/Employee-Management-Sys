# Local Environment Configuration (Run via: mvn spring-boot:run -Dspring-boot.run.profiles=local)
spring.application.name=Employee-Management-System

# Local MySQL Database Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/employee?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Actuator Endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
